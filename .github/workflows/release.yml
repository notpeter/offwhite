name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: offwhite-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: offwhite-linux-aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: offwhite-windows-x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: offwhite-windows-aarch64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            archive: offwhite-macos-x86_64
          - os: macos-26
            target: aarch64-apple-darwin
            archive: offwhite-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: |
          rustup install

      - run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/offwhite offwhite
          tar czf ${{ matrix.archive }}-${GITHUB_REF_NAME}.tar.gz offwhite

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/offwhite.exe offwhite.exe
          7z a ${{ matrix.archive }}-${GITHUB_REF_NAME}.zip offwhite.exe

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.archive }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          generate_release_notes: true
          files: artifacts/*
